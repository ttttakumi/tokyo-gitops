- name: macOS - DNS uses Cloudflare (1.1.1.1)
  query: SELECT 1 WHERE EXISTS (SELECT 1 FROM dns_resolvers WHERE type = 'nameserver' AND address = '1.1.1.1') AND NOT EXISTS (SELECT 1 FROM dns_resolvers WHERE type = 'nameserver' AND address NOT IN ('1.1.1.1', '1.0.0.1', '2606:4700:4700::1111', '2606:4700:4700::1001'));
  critical: true
  description: This Mac's DNS isn't set to Cloudflare (1.1.1.1). Using other DNS servers can bypass company DNS filtering and expose browsing to untrusted resolvers.
  resolution: |
    Open System Settings > Network, select your active connection, click Details > DNS, and set the DNS servers to 1.1.1.1 and 1.0.0.1 (remove any others). Contact IT if you can't change it.
  platform: darwin
